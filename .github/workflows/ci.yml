name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and quality tools
        run: python -m pip install -e ".[dev,notebook]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src

      - name: Test without model download
        run: python -m pytest -q -m "not model"

      - name: Clean installation smoke test
        run: |
          clean_env="$RUNNER_TEMP/textgraphicalizer-clean"
          python -m venv "$clean_env"
          "$clean_env/bin/python" -m pip install --upgrade pip
          "$clean_env/bin/python" -m pip install .
          "$clean_env/bin/python" -c "from textgraphicalizer import TextGraphicalizer; print(TextGraphicalizer)"
