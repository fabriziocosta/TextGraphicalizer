[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textgraphicalizer"
version = "0.1.0"
description = "Convert text into ontology-constrained NetworkX graphs with Laya."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TextGraphicalizer contributors" }]
dependencies = [
    "laya==0.1.6",
    "networkx>=3.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "scikit-learn>=1.2",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "model: requires downloading/loading the Laya checkpoint",
]
