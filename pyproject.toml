[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textgraphicalizer"
version = "0.1.0"
description = "Convert text into ontology-constrained NetworkX graphs with Laya."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TextGraphicalizer contributors" }]
dependencies = [
    "laya==0.1.6",
    "networkx>=3.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "scikit-learn>=1.2",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
notebook = [
    "jupyterlab>=4.0",
    "matplotlib>=3.7",
    "ipykernel>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.textgraphicalizer]
model_id = "convaiinnovations/laya"
model_revision = "7c76b622dfc5cac71b2dc1c29873efe2ce509a05"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "model: requires downloading/loading the Laya checkpoint",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
